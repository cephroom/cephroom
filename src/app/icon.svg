<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="32" height="32">
  <!--
    Cephroom. A small hollow centre and eight arms, each ending in a
    ganglion: most of an octopus's neurons are in its arms, and most of this
    platform's data and judgement are at its edges.

    Drawn from arithmetic — eight arms on 45 degree centres, curled 26 degrees,
    tips at r=7.5 with ganglia at r=9.55. Original work; nothing traced.

    A favicon has no CSS custom properties available and is rendered against
    both light and dark browser chrome, so the colours are literal here and
    chosen to hold up on either: the accent orange carries the arms and
    ganglia — the mass — and the purple counterpart rings the hollow centre.
  -->
  <g fill="none" stroke="#e8590c" stroke-linecap="round">
    <path stroke-width="1.15" opacity="0.62" d="M13.53 8.3Q15.37 7.04 17.62 7.03M15.7 10.47Q17.89 10.88 19.49 12.46M15.7 13.53Q16.96 15.37 16.97 17.62M13.53 15.7Q13.12 17.89 11.54 19.49M10.47 15.7Q8.63 16.96 6.38 16.97M8.3 13.53Q6.11 13.12 4.51 11.54M8.3 10.47Q7.04 8.63 7.03 6.38M10.47 8.3Q10.88 6.11 12.46 4.51" />
  </g>
  <g fill="#e8590c">
    <circle cx="19.53" cy="6.12" r="1.7" />
    <circle cx="21.48" cy="13.16" r="1.7" />
    <circle cx="17.88" cy="19.53" r="1.7" />
    <circle cx="10.84" cy="21.48" r="1.7" />
    <circle cx="4.47" cy="17.88" r="1.7" />
    <circle cx="2.52" cy="10.84" r="1.7" />
    <circle cx="6.12" cy="4.47" r="1.7" />
    <circle cx="13.16" cy="2.52" r="1.7" />
  </g>
  <circle cx="12" cy="12" r="2.85" fill="none" stroke="#8b4fd0" stroke-width="1.5" />
</svg>
